  validate-honua-gp:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - pre-publish-typecheck
    if: needs.resolve-publish-targets.outputs.gp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
