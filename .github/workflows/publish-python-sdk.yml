    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"
        working-directory: ${{ github.workspace }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked third-party dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r "${GITHUB_WORKSPACE}/.github/requirements/publish-python.lock"

      - name: Install commit-bound local packages without dependency resolution
        run: |
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            -e "${GITHUB_WORKSPACE}/release-source/packages/honua-sdk"
          python -m pip install --no-deps --no-build-isolation -e "${GITHUB_WORKSPACE}/release-source/packages/honua-admin"

      - name: Run compatibility gate
        run: python release-source/scripts/compatibility_gate.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK coverage gate
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python release-source/scripts/gen_sdk_coverage.py
        working-directory: ${{ github.workspace }}

      - name: Install GP package
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run tests
        run: python -m pytest release-source/packages/honua-gp/tests -q --tb=short
        working-directory: ${{ github.workspace }}

      - name: Validate tag version
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ needs.resolve-publish-targets.outputs.gp_tag }}
        run: >
          python "${GITHUB_WORKSPACE}/release-source/scripts/validate_publish_tag.py"
          --pyproject pyproject.toml
          --tag "$EXPECTED_TAG"
          --prefix python-gp-v

