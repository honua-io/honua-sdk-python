name: Python SDK CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock

      - name: Run Ruff
        run: ruff check .

      - name: Enforce maintained documentation command policy
        run: python scripts/check_docs_command_policy.py

      - name: Verify generated sync clients are not stale
        # The synchronous clients (honua_sdk/client.py, honua_admin/_client.py)
        # are generated from their async source-of-truth by scripts/gen_sync.py
        # and committed. If someone edits an async client without regenerating,
        # the committed sync mirror drifts. Regenerate and fail on any diff so
        # the two never diverge silently. (Uses ruff — installed above — for the
        # import-sort pass; no package install needed.)
        run: |
          python scripts/gen_sync.py --check

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/honua-sdk/pyproject.toml
            packages/honua-admin/pyproject.toml

      - name: Install packages and mypy
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          pip install --no-deps --no-build-isolation -e "packages/honua-sdk[grpc]"
          pip install --no-deps --no-build-isolation -e "packages/honua-admin"

      - name: Run mypy
        run: python -m mypy packages/honua-sdk/honua_sdk packages/honua-admin/honua_admin

  test:
    runs-on: ${{ matrix.os }}
    # Use bash on every OS (incl. Windows) so the multi-line ``run`` blocks with
    # ``\`` continuations parse consistently instead of hitting PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        extras: ["grpc", "grpc,geopandas"]
        include:
          - os: macos-latest
            python-version: "3.11"
            extras: "grpc,geopandas"
          - os: windows-latest
            python-version: "3.11"
            extras: "grpc,geopandas"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            packages/honua-sdk/pyproject.toml
            packages/honua-admin/pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          pip install --no-deps --no-build-isolation -e "packages/honua-sdk[${{ matrix.extras }}]"
          pip install --no-deps --no-build-isolation -e "packages/honua-admin"

      - name: Run tests with combined coverage gate
        shell: bash
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=honua_sdk --cov=honua_admin \
            --cov-report=term-missing --cov-report=xml --cov-fail-under=94

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' && matrix.extras == 'grpc,geopandas'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.xml
          # The local ``--cov-fail-under=94`` step above is the real
          # coverage gate; a Codecov upload hiccup is a third-party
          # availability issue, not a coverage regression.
          fail_ci_if_error: false

      - name: Per-package coverage floor (honua_sdk)
        shell: bash
        run: |
          python -m pytest tests/ -q --tb=short \
            --cov=honua_sdk --cov-report=term \
            --cov-fail-under=93

      - name: Per-package coverage floor (honua_admin)
        shell: bash
        run: |
          python -m pytest tests/admin -q --tb=short \
            --cov=honua_admin --cov-report=term \
            --cov-fail-under=93

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/honua-sdk/pyproject.toml
            packages/honua-admin/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          pip install --no-deps --no-build-isolation -e "packages/honua-sdk[grpc]"
          pip install --no-deps --no-build-isolation -e "packages/honua-admin"

      - name: Run compatibility gate
        run: python scripts/compatibility_gate.py

      - name: Run SDK coverage gate
        # Validates compatibility/sdk-coverage.v1.json: every capability key
        # is checked against honua-server's *live* published key list (not
        # the offline compatibility/capability-keys.fixture.json fallback
        # gen_sdk_coverage.py uses locally), every entrypoint is resolved
        # against the installed packages (renamed/removed symbol -> fail),
        # and the committed snapshot must match a fresh generation exactly.
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python scripts/gen_sdk_coverage.py

      - name: Upload SDK coverage snapshot artifact
        # Published on trunk builds only (per honua-sdk-python#182), for
        # honua-evidence's aggregate capability-matrix run to consume.
        if: github.ref == 'refs/heads/trunk' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-coverage-v1
          path: compatibility/sdk-coverage.v1.json
          if-no-files-found: error
          retention-days: 90

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/honua-sdk/pyproject.toml
            packages/honua-admin/pyproject.toml

      - name: Install packages and pip-audit
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          pip install --no-deps --no-build-isolation -e "packages/honua-sdk[grpc,geopandas]"
          pip install --no-deps --no-build-isolation -e "packages/honua-admin"

      - name: Security audit (pip-audit)
        # The two local workspace packages (honua-sdk / honua-admin) are
        # installed editable and are not published to PyPI, so pip-audit
        # cannot resolve them. Under ``--strict`` even ``--skip-editable``
        # turns those into hard errors, so instead audit a frozen
        # requirements list with the local editable packages filtered out.
        # Every third-party dependency is still audited strictly.
        run: |
          pip freeze --exclude-editable > audit-requirements.txt
          echo "Auditing third-party dependencies:"
          cat audit-requirements.txt
          python -m pip_audit --strict --requirement audit-requirements.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/honua-sdk/pyproject.toml
            packages/honua-admin/pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock

      - name: Build honua-sdk
        run: python -m build --no-isolation
        working-directory: packages/honua-sdk

      - name: Check honua-sdk distribution
        run: twine check dist/*
        working-directory: packages/honua-sdk

      - name: Assert honua-sdk wheel contents
        # twine check validates metadata but not packaged files. Assert the
        # non-obvious payload (PEP 561 marker, shared retry core, the grpc and
        # migration subpackages) is actually inside the wheel so a packaging
        # regression — e.g. a dropped ``[tool.hatch.build]`` include or a missed
        # ``py.typed`` — fails the build instead of shipping a wheel that drops
        # type hints or whole subpackages.
        shell: bash
        working-directory: packages/honua-sdk
        run: |
          wheel=$(ls dist/honua_sdk-*.whl)
          echo "Inspecting $wheel"
          contents=$(python -m zipfile -l "$wheel")
          missing=0
          for expected in \
            "honua_sdk/py.typed" \
            "honua_sdk/_retry_core.py" \
            "honua_sdk/grpc/" \
            "honua_sdk/migration/" \
            "honua_sdk/grpc/_generated/honua/v1/feature_service_pb2.pyi"; do
            if echo "$contents" | grep -q "$expected"; then
              echo "  ok: $expected"
            else
              echo "  MISSING: $expected"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::honua-sdk wheel is missing expected contents"
            echo "$contents"
            exit 1
          fi

      - name: Build honua-admin
        run: python -m build --no-isolation
        working-directory: packages/honua-admin

      - name: Check honua-admin distribution
        run: twine check dist/*
        working-directory: packages/honua-admin

      - name: Assert honua-admin wheel contents
        # Mirror the honua-sdk contents assertion so an admin packaging
        # regression (dropped ``py.typed`` marker, a missed client facade, or
        # the shared ``_endpoints``/``_arcpy_scanner`` modules) fails the build
        # instead of shipping a wheel that loses type hints or whole modules.
        shell: bash
        working-directory: packages/honua-admin
        run: |
          wheel=$(ls dist/honua_admin-*.whl)
          echo "Inspecting $wheel"
          contents=$(python -m zipfile -l "$wheel")
          missing=0
          for expected in \
            "honua_admin/py.typed" \
            "honua_admin/_client.py" \
            "honua_admin/_async_client.py" \
            "honua_admin/_endpoints.py" \
            "honua_admin/_arcpy_scanner.py"; do
            if echo "$contents" | grep -q "$expected"; then
              echo "  ok: $expected"
            else
              echo "  MISSING: $expected"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::honua-admin wheel is missing expected contents"
            echo "$contents"
            exit 1
          fi

      - name: Smoke-install built wheels in a fresh venv
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          /tmp/wheel-smoke/bin/pip install --no-deps --no-build-isolation packages/honua-sdk/dist/honua_sdk-*.whl
          /tmp/wheel-smoke/bin/pip install --no-deps --no-build-isolation packages/honua-admin/dist/honua_admin-*.whl
          /tmp/wheel-smoke/bin/python -c "import honua_sdk; import honua_admin; print('ok', honua_sdk.__version__, honua_admin.__version__)"
