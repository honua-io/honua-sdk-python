name: Publish Python Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build/publish (honua-sdk, honua-admin, or both)"
        required: true
        default: "both"
        type: choice
        options:
          - honua-sdk
          - honua-admin
          - both
      dry_run:
        description: "Run build and validation only (skip publish)"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Exact release tag (required for a non-dry manual run)"
        required: false
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] same-repo trunk guard + ancestry gate
    workflows:
      - Release Please
    types:
      - completed

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: publish-python-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-publish-targets:
    if: >
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'trunk'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.plan.outputs.release_sha }}
      should_build: ${{ steps.plan.outputs.should_build }}
      publish: ${{ steps.plan.outputs.publish }}
      sdk: ${{ steps.plan.outputs.sdk }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      sdk_tag: ${{ steps.plan.outputs.sdk_tag }}
      admin: ${{ steps.plan.outputs.admin }}
      admin_version: ${{ steps.plan.outputs.admin_version }}
      admin_tag: ${{ steps.plan.outputs.admin_tag }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve exact package tags and release commit
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REQUESTED_PACKAGE: ${{ inputs.package || 'both' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          TARGET_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag) || github.sha }}
        run: |
          python -m scripts.resolve_publish_targets \
            --workspace . \
            --target-ref "$TARGET_REF" \
            --event-name "$EVENT_NAME" \
            --workflow-ref "$WORKFLOW_REF" \
            --package "$REQUESTED_PACKAGE" \
            --dry-run "$DRY_RUN" \
            --release-tag "$RELEASE_TAG"

  verify-github-releases:
    needs: resolve-publish-targets
    if: needs.resolve-publish-targets.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected GitHub Releases through REST
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
          PUBLISH: ${{ needs.resolve-publish-targets.outputs.publish }}
          SDK_SELECTED: ${{ needs.resolve-publish-targets.outputs.sdk }}
          SDK_TAG: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}
          ADMIN_SELECTED: ${{ needs.resolve-publish-targets.outputs.admin }}
          ADMIN_TAG: ${{ needs.resolve-publish-targets.outputs.admin_tag }}
        run: |
          if [[ "$PUBLISH" != "true" ]]; then
            echo "Dry run: GitHub Release verification is not required."
            exit 0
          fi

          verify_release() {
            local tag="$1"
            local release actual_tag target draft
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            actual_tag="$(jq -r .tag_name <<<"$release")"
            target="$(jq -r .target_commitish <<<"$release")"
            draft="$(jq -r .draft <<<"$release")"
            [[ "$actual_tag" == "$tag" ]] || { echo "Release/tag mismatch for $tag" >&2; return 1; }
            [[ "$target" == "$RELEASE_SHA" ]] || { echo "Release $tag targets $target, expected $RELEASE_SHA" >&2; return 1; }
            [[ "$draft" == "false" ]] || { echo "Release $tag is still a draft" >&2; return 1; }
          }

          [[ "$SDK_SELECTED" != "true" ]] || verify_release "$SDK_TAG"
          [[ "$ADMIN_SELECTED" != "true" ]] || verify_release "$ADMIN_TAG"

  pre-publish-typecheck:
    needs:
      - resolve-publish-targets
      - verify-github-releases
    if: needs.resolve-publish-targets.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "./release-source/packages/honua-sdk[grpc]"
          pip install -e ./release-source/packages/honua-admin
          pip install mypy

      - name: Run mypy
        run: |
          python -m mypy \
            release-source/packages/honua-sdk/honua_sdk \
            release-source/packages/honua-admin/honua_admin

  build-honua-sdk:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - pre-publish-typecheck
    if: needs.resolve-publish-targets.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: release-source/packages/honua-sdk
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"
        working-directory: ${{ github.workspace }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[grpc]"
          pip install pytest hatch

      - name: Run compatibility gate
        run: python release-source/scripts/compatibility_gate.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK coverage gate
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python release-source/scripts/gen_sdk_coverage.py
        working-directory: ${{ github.workspace }}

      - name: Install honua-admin (for full smoke coverage)
        run: pip install -e "${{ github.workspace }}/release-source/packages/honua-admin"

      - name: Run SDK tests
        run: python -m pytest release-source/tests/ -q --tb=short
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/release-source/packages/honua-sdk

      - name: Validate tag version
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}
        run: >
          python "${GITHUB_WORKSPACE}/release-source/scripts/validate_publish_tag.py"
          --pyproject pyproject.toml
          --tag "$EXPECTED_TAG"
          --prefix python-sdk-v

      - name: Build package
        run: hatch build

      - name: Create immutable distribution manifest
        env:
          EXPECTED_VERSION: ${{ needs.resolve-publish-targets.outputs.sdk_version }}
        run: >
          python "${GITHUB_WORKSPACE}/scripts/verify_distribution_parity.py"
          manifest
          --dist-dir dist
          --package honua-sdk
          --version "$EXPECTED_VERSION"
          --output dist-manifest.json

      - name: Upload verified SDK artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-source/packages/honua-sdk/dist
            release-source/packages/honua-sdk/dist-manifest.json
          if-no-files-found: error
          retention-days: 14

  preflight-honua-sdk-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish_required: ${{ steps.parity.outputs.publish_required }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Require absent coordinate or exact PyPI parity
        id: parity
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase preflight

  publish-honua-sdk:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
      - preflight-honua-sdk-pypi
      - preflight-honua-admin-pypi
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-sdk.result == 'success'
      && needs.preflight-honua-sdk-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
      && needs.preflight-honua-sdk-pypi.outputs.publish_required == 'true'
      && (needs.resolve-publish-targets.outputs.admin != 'true'
          || needs.preflight-honua-admin-pypi.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi-honua-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Publish SDK to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifact/dist

  verify-honua-sdk-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
      - preflight-honua-sdk-pypi
      - publish-honua-sdk
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-sdk.result == 'success'
      && needs.resolve-publish-targets.outputs.sdk == 'true'
      && (needs.resolve-publish-targets.outputs.publish != 'true'
          || (needs.preflight-honua-sdk-pypi.result == 'success'
              && (needs.preflight-honua-sdk-pypi.outputs.publish_required != 'true'
                  || needs.publish-honua-sdk.result == 'success')))
    runs-on: ubuntu-latest
    steps:
      - name: Record dry build completion
        if: needs.resolve-publish-targets.outputs.publish != 'true'
        run: echo "Dry run completed without accessing PyPI publishing credentials."

      - name: Checkout trusted publication automation
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified SDK artifact
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Verify final SDK PyPI filename and SHA256 parity
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase post-publish

  attach-honua-sdk-release:
    needs:
      - resolve-publish-targets
      - verify-honua-sdk-pypi
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified SDK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Reconcile exact SDK assets and PyPI link
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: honua-sdk
          VERSION: ${{ needs.resolve-publish-targets.outputs.sdk_version }}
          TAG: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          release_id="$(jq -r .id <<<"$release")"
          mapfile -t filenames < <(jq -r '.files[].filename' artifact/dist-manifest.json)
          [[ "${#filenames[@]}" == "2" ]] || { echo "Manifest must contain two files" >&2; exit 1; }

          for filename in "${filenames[@]}"; do
            [[ "$filename" != */* && "$filename" != *\\* ]] || { echo "Unsafe asset filename" >&2; exit 1; }
            file="artifact/dist/$filename"
            expected="$(jq -r --arg name "$filename" '.files[] | select(.filename == $name) | .sha256' artifact/dist-manifest.json)"
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            [[ "$actual" == "$expected" ]] || { echo "Local asset hash mismatch for $filename" >&2; exit 1; }

            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")"
            count="$(jq --arg name "$filename" '[.[] | select(.name == $name)] | length' <<<"$assets")"
            [[ "$count" -le 1 ]] || { echo "Duplicate release assets named $filename" >&2; exit 1; }
            if [[ "$count" == "0" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            else
              remote_digest="$(jq -r --arg name "$filename" '.[] | select(.name == $name) | .digest // ""' <<<"$assets")"
              [[ "$remote_digest" == "sha256:$expected" ]] || { echo "Existing asset hash mismatch for $filename" >&2; exit 1; }
            fi

            for attempt in {1..6}; do
              assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")"
              remote_digest="$(jq -r --arg name "$filename" '.[] | select(.name == $name) | .digest // ""' <<<"$assets")"
              [[ "$remote_digest" == "sha256:$expected" ]] && break
              [[ "$attempt" == "6" ]] && { echo "Uploaded asset hash mismatch for $filename" >&2; exit 1; }
              sleep 2
            done
          done

          marker="<!-- honua-pypi-link:${PACKAGE}:${VERSION} -->"
          body_file="$(mktemp)"
          jq -r '.body // ""' <<<"$release" > "$body_file"
          if ! grep -Fq "$marker" "$body_file"; then
            {
              printf '\n\n## Install from PyPI\n\n%s\n\n' "$marker"
              printf '`pip install "%s==%s"`\n\n' "$PACKAGE" "$VERSION"
              printf '[View %s %s on PyPI](https://pypi.org/project/%s/%s/)\n' "$PACKAGE" "$VERSION" "$PACKAGE" "$VERSION"
            } >> "$body_file"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body_file"
          fi

  build-honua-admin:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - pre-publish-typecheck
    if: needs.resolve-publish-targets.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: release-source/packages/honua-admin
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"
        working-directory: ${{ github.workspace }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "${{ github.workspace }}/release-source/packages/honua-sdk[grpc]"
          pip install -e .
          pip install pytest hatch

      - name: Run compatibility gate
        run: python release-source/scripts/compatibility_gate.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK coverage gate
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python release-source/scripts/gen_sdk_coverage.py
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: python -m pytest release-source/tests/ -q --tb=short
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/release-source/packages/honua-sdk

      - name: Validate tag version
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ needs.resolve-publish-targets.outputs.admin_tag }}
        run: >
          python "${GITHUB_WORKSPACE}/release-source/scripts/validate_publish_tag.py"
          --pyproject pyproject.toml
          --tag "$EXPECTED_TAG"
          --prefix python-admin-v

      - name: Build package
        run: hatch build

      - name: Create immutable distribution manifest
        env:
          EXPECTED_VERSION: ${{ needs.resolve-publish-targets.outputs.admin_version }}
        run: >
          python "${GITHUB_WORKSPACE}/scripts/verify_distribution_parity.py"
          manifest
          --dist-dir dist
          --package honua-admin
          --version "$EXPECTED_VERSION"
          --output dist-manifest.json

      - name: Upload verified admin artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: honua-admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-source/packages/honua-admin/dist
            release-source/packages/honua-admin/dist-manifest.json
          if-no-files-found: error
          retention-days: 14

  preflight-honua-admin-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-admin
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish_required: ${{ steps.parity.outputs.publish_required }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified admin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Require absent coordinate or exact PyPI parity
        id: parity
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase preflight

  publish-honua-admin:
    needs:
      - resolve-publish-targets
      - build-honua-admin
      - preflight-honua-admin-pypi
      - verify-honua-sdk-pypi
      - attach-honua-sdk-release
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-admin.result == 'success'
      && needs.preflight-honua-admin-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
      && needs.preflight-honua-admin-pypi.outputs.publish_required == 'true'
      && (needs.resolve-publish-targets.outputs.sdk != 'true'
          || (needs.verify-honua-sdk-pypi.result == 'success'
              && needs.attach-honua-sdk-release.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi-honua-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified admin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Publish admin to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: artifact/dist

  verify-honua-admin-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-admin
      - preflight-honua-admin-pypi
      - publish-honua-admin
      - verify-honua-sdk-pypi
      - attach-honua-sdk-release
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-admin.result == 'success'
      && needs.resolve-publish-targets.outputs.admin == 'true'
      && (needs.resolve-publish-targets.outputs.publish != 'true'
          || (needs.preflight-honua-admin-pypi.result == 'success'
              && (needs.preflight-honua-admin-pypi.outputs.publish_required != 'true'
                  || needs.publish-honua-admin.result == 'success')
              && (needs.resolve-publish-targets.outputs.sdk != 'true'
                  || (needs.verify-honua-sdk-pypi.result == 'success'
                      && needs.attach-honua-sdk-release.result == 'success'))))
    runs-on: ubuntu-latest
    steps:
      - name: Record dry build completion
        if: needs.resolve-publish-targets.outputs.publish != 'true'
        run: echo "Dry run completed without accessing PyPI publishing credentials."

      - name: Checkout trusted publication automation
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified admin artifact
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Verify final admin PyPI filename and SHA256 parity
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase post-publish

  attach-honua-admin-release:
    needs:
      - resolve-publish-targets
      - verify-honua-admin-pypi
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified admin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact

      - name: Reconcile exact admin assets and PyPI link
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: honua-admin
          VERSION: ${{ needs.resolve-publish-targets.outputs.admin_version }}
          TAG: ${{ needs.resolve-publish-targets.outputs.admin_tag }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          release_id="$(jq -r .id <<<"$release")"
          mapfile -t filenames < <(jq -r '.files[].filename' artifact/dist-manifest.json)
          [[ "${#filenames[@]}" == "2" ]] || { echo "Manifest must contain two files" >&2; exit 1; }

          for filename in "${filenames[@]}"; do
            [[ "$filename" != */* && "$filename" != *\\* ]] || { echo "Unsafe asset filename" >&2; exit 1; }
            file="artifact/dist/$filename"
            expected="$(jq -r --arg name "$filename" '.files[] | select(.filename == $name) | .sha256' artifact/dist-manifest.json)"
            actual="$(sha256sum "$file" | cut -d ' ' -f1)"
            [[ "$actual" == "$expected" ]] || { echo "Local asset hash mismatch for $filename" >&2; exit 1; }

            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")"
            count="$(jq --arg name "$filename" '[.[] | select(.name == $name)] | length' <<<"$assets")"
            [[ "$count" -le 1 ]] || { echo "Duplicate release assets named $filename" >&2; exit 1; }
            if [[ "$count" == "0" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            else
              remote_digest="$(jq -r --arg name "$filename" '.[] | select(.name == $name) | .digest // ""' <<<"$assets")"
              [[ "$remote_digest" == "sha256:$expected" ]] || { echo "Existing asset hash mismatch for $filename" >&2; exit 1; }
            fi

            for attempt in {1..6}; do
              assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets")"
              remote_digest="$(jq -r --arg name "$filename" '.[] | select(.name == $name) | .digest // ""' <<<"$assets")"
              [[ "$remote_digest" == "sha256:$expected" ]] && break
              [[ "$attempt" == "6" ]] && { echo "Uploaded asset hash mismatch for $filename" >&2; exit 1; }
              sleep 2
            done
          done

          marker="<!-- honua-pypi-link:${PACKAGE}:${VERSION} -->"
          body_file="$(mktemp)"
          jq -r '.body // ""' <<<"$release" > "$body_file"
          if ! grep -Fq "$marker" "$body_file"; then
            {
              printf '\n\n## Install from PyPI\n\n%s\n\n' "$marker"
              printf '`pip install "%s==%s"`\n\n' "$PACKAGE" "$VERSION"
              printf '[View %s %s on PyPI](https://pypi.org/project/%s/%s/)\n' "$PACKAGE" "$VERSION" "$PACKAGE" "$VERSION"
            } >> "$body_file"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body_file"
          fi
