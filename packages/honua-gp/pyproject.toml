[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "honua-gp"
version = "0.1.0"
description = "Honua geoprocessing compatibility layer -- a drop-in-style API for teams moving Python geoprocessing scripts to Honua services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Honua" }]
keywords = ["gp", "geospatial", "gis", "migration", "honua", "compatibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  # The floor tracks the honua-sdk release (release-please generic updater).
  "honua-sdk>=0.3.1",  # x-release-please-version
  "honua-admin>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/honua-io"
Repository = "https://github.com/honua-io/honua-sdk-python"
Issues = "https://github.com/honua-io/honua-sdk-python/issues"

[project.scripts]
honua-gp = "honua_gp._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["honua_gp"]

[tool.hatch.build.targets.sdist]
include = [
  "honua_gp",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
