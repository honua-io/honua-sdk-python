name: Publish Python Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build/publish (honua-sdk, honua-admin, honua-gp, or SDK and Admin together)"
        required: true
        default: "both"
        type: choice
        options:
          - honua-sdk
          - honua-admin
          - honua-gp
          - both
      dry_run:
        description: "Run build and validation only (skip publish)"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Exact release tag (required for a non-dry manual run)"
        required: false
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] same-repo trunk guard + ancestry gate
    workflows:
      - Release Please
    types:
      - completed

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

concurrency:
  # GitHub keeps at most one pending run per group. Workflow-run IDs keep a
  # later no-op Release Please completion from replacing a tagged reconciliation;
  # manual production runs deduplicate on their exact release coordinate.
  group: >-
    publish-python-packages-${{
      github.event_name == 'workflow_run'
      && format('workflow-run-{0}', github.event.workflow_run.id)
      || (inputs.dry_run
          && format('manual-dry-run-{0}', github.run_id)
          || format('manual-release-{0}-{1}', inputs.package, inputs.release_tag || github.run_id))
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-publish-targets:
    if: >
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'trunk'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.plan.outputs.release_sha }}
      should_build: ${{ steps.plan.outputs.should_build }}
      publish: ${{ steps.plan.outputs.publish }}
      sdk: ${{ steps.plan.outputs.sdk }}
      sdk_version: ${{ steps.plan.outputs.sdk_version }}
      sdk_tag: ${{ steps.plan.outputs.sdk_tag }}
      admin: ${{ steps.plan.outputs.admin }}
      admin_version: ${{ steps.plan.outputs.admin_version }}
      admin_tag: ${{ steps.plan.outputs.admin_tag }}
      gp: ${{ steps.plan.outputs.gp }}
      gp_version: ${{ steps.plan.outputs.gp_version }}
      gp_tag: ${{ steps.plan.outputs.gp_tag }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve exact package tags and release commit
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          REQUESTED_PACKAGE: ${{ inputs.package || 'both' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
          TARGET_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag) || github.sha }}
        run: |
          python -m scripts.resolve_publish_targets \
            --workspace . \
            --target-ref "$TARGET_REF" \
            --event-name "$EVENT_NAME" \
            --workflow-ref "$WORKFLOW_REF" \
            --package "$REQUESTED_PACKAGE" \
            --dry-run "$DRY_RUN" \
            --release-tag "$RELEASE_TAG"

  verify-github-releases:
    needs: resolve-publish-targets
    if: needs.resolve-publish-targets.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify selected GitHub Releases through REST
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
          PUBLISH: ${{ needs.resolve-publish-targets.outputs.publish }}
          SDK_SELECTED: ${{ needs.resolve-publish-targets.outputs.sdk }}
          SDK_TAG: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}
          ADMIN_SELECTED: ${{ needs.resolve-publish-targets.outputs.admin }}
          GP_SELECTED: ${{ needs.resolve-publish-targets.outputs.gp }}
          ADMIN_TAG: ${{ needs.resolve-publish-targets.outputs.admin_tag }}
          GP_TAG: ${{ needs.resolve-publish-targets.outputs.gp_tag }}
        run: |
          if [[ "$PUBLISH" != "true" ]]; then
            echo "Dry run: GitHub Release verification is not required."
            exit 0
          fi

          verify_release() {
            local tag="$1"
            local release actual_tag target draft
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
            actual_tag="$(jq -r .tag_name <<<"$release")"
            target="$(jq -r .target_commitish <<<"$release")"
            draft="$(jq -r .draft <<<"$release")"
            [[ "$actual_tag" == "$tag" ]] || { echo "Release/tag mismatch for $tag" >&2; return 1; }
            [[ "$target" == "$RELEASE_SHA" ]] || { echo "Release $tag targets $target, expected $RELEASE_SHA" >&2; return 1; }
            [[ "$draft" == "false" ]] || { echo "Release $tag is still a draft" >&2; return 1; }
          }

          [[ "$SDK_SELECTED" != "true" ]] || verify_release "$SDK_TAG"
          [[ "$ADMIN_SELECTED" != "true" ]] || verify_release "$ADMIN_TAG"
          [[ "$GP_SELECTED" != "true" ]] || verify_release "$GP_TAG"

      - name: Require protected environments and immutable release tags
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_SELECTED: ${{ needs.resolve-publish-targets.outputs.sdk }}
          ADMIN_SELECTED: ${{ needs.resolve-publish-targets.outputs.admin }}
          GP_SELECTED: ${{ needs.resolve-publish-targets.outputs.gp }}
        run: |
          if [[ "$SDK_SELECTED" == "true" ]]; then
            python scripts/verify_publication_controls.py \
              --repository "$GITHUB_REPOSITORY" \
              --environment pypi-honua-sdk \
              --tag-pattern 'refs/tags/python-sdk-v*'
          fi
          if [[ "$ADMIN_SELECTED" == "true" ]]; then
            python scripts/verify_publication_controls.py \
              --repository "$GITHUB_REPOSITORY" \
              --environment pypi-honua-admin \
              --tag-pattern 'refs/tags/python-admin-v*'
          fi
          if [[ "$GP_SELECTED" == "true" ]]; then
            python scripts/verify_publication_controls.py \
              --repository "$GITHUB_REPOSITORY" \
              --environment pypi-honua-gp \
              --tag-pattern 'refs/tags/python-gp-v*'
          fi

  pre-publish-typecheck:
    needs:
      - resolve-publish-targets
      - verify-github-releases
    if: needs.resolve-publish-targets.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked third-party dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock

      - name: Install commit-bound local packages without dependency resolution
        run: |
          python -m pip install --no-deps --no-build-isolation -e ./release-source/packages/honua-sdk
          python -m pip install --no-deps --no-build-isolation -e ./release-source/packages/honua-admin

      - name: Run mypy
        run: |
          python -m mypy \
            release-source/packages/honua-sdk/honua_sdk \
            release-source/packages/honua-admin/honua_admin

  validate-honua-sdk:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - pre-publish-typecheck
    if: needs.resolve-publish-targets.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: release-source/packages/honua-sdk
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"
        working-directory: ${{ github.workspace }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked third-party dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r "${GITHUB_WORKSPACE}/.github/requirements/publish-python.lock"

      - name: Install commit-bound local packages without dependency resolution
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            -e "${GITHUB_WORKSPACE}/release-source/packages/honua-admin"

      - name: Run compatibility gate
        run: python release-source/scripts/compatibility_gate.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK coverage gate
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python release-source/scripts/gen_sdk_coverage.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK tests
        run: python -m pytest release-source/tests/ -q --tb=short
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/release-source/packages/honua-sdk

      - name: Validate tag version
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}
        run: >
          python "${GITHUB_WORKSPACE}/release-source/scripts/validate_publish_tag.py"
          --pyproject pyproject.toml
          --tag "$EXPECTED_TAG"
          --prefix python-sdk-v

  build-honua-sdk:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - validate-honua-sdk
    if: needs.resolve-publish-targets.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked build backend
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock

      - name: Build reproducible distribution
        uses: ./.github/actions/build-python-distribution
        with:
          package: honua-sdk
          release-sha: ${{ needs.resolve-publish-targets.outputs.release_sha }}
          version: ${{ needs.resolve-publish-targets.outputs.sdk_version }}

      - name: Upload verified SDK artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honua-sdk-dist-${{ github.run_id }}
          path: |
            publish-artifact/dist
            publish-artifact/dist-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  preflight-honua-sdk-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish_required: ${{ steps.parity.outputs.publish_required }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified SDK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}
          path: artifact

      - name: Require absent coordinate or exact PyPI parity
        id: parity
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase preflight

  publish-honua-sdk:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
      - preflight-honua-sdk-pypi
      - preflight-honua-admin-pypi
      - preflight-honua-gp-pypi
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-sdk.result == 'success'
      && needs.preflight-honua-sdk-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
      && needs.preflight-honua-sdk-pypi.outputs.publish_required == 'true'
      && (needs.resolve-publish-targets.outputs.admin != 'true'
          || needs.preflight-honua-admin-pypi.result == 'success')
      && (needs.resolve-publish-targets.outputs.gp != 'true'
          || needs.preflight-honua-gp-pypi.result == 'success')
    runs-on: ubuntu-latest
    environment: pypi-honua-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified SDK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}
          path: artifact

      - name: Publish SDK to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifact/dist

  verify-honua-sdk-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-sdk
      - preflight-honua-sdk-pypi
      - publish-honua-sdk
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-sdk.result == 'success'
      && needs.resolve-publish-targets.outputs.sdk == 'true'
      && (needs.resolve-publish-targets.outputs.publish != 'true'
          || (needs.preflight-honua-sdk-pypi.result == 'success'
              && (needs.preflight-honua-sdk-pypi.outputs.publish_required != 'true'
                  || needs.publish-honua-sdk.result == 'success')))
    runs-on: ubuntu-latest
    steps:
      - name: Record dry build completion
        if: needs.resolve-publish-targets.outputs.publish != 'true'
        run: echo "Dry run completed without accessing PyPI publishing credentials."

      - name: Checkout trusted publication automation
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified SDK artifact
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}
          path: artifact

      - name: Verify final SDK PyPI filename and SHA256 parity
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase post-publish

  attach-honua-sdk-release:
    needs:
      - resolve-publish-targets
      - verify-honua-sdk-pypi
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.verify-honua-sdk-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified SDK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-sdk-dist-${{ github.run_id }}
          path: artifact

      - name: Reconcile exact package assets and registry link
        uses: ./.github/actions/attach-python-release
        with:
          github-token: ${{ github.token }}
          package: honua-sdk
          version: ${{ needs.resolve-publish-targets.outputs.sdk_version }}
          tag: ${{ needs.resolve-publish-targets.outputs.sdk_tag }}

  validate-honua-admin:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - pre-publish-typecheck
    if: needs.resolve-publish-targets.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: release-source/packages/honua-admin
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize exact release source
        env:
          RELEASE_SHA: ${{ needs.resolve-publish-targets.outputs.release_sha }}
        run: git worktree add --detach release-source "$RELEASE_SHA"
        working-directory: ${{ github.workspace }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked third-party dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r "${GITHUB_WORKSPACE}/.github/requirements/publish-python.lock"

      - name: Install commit-bound local packages without dependency resolution
        run: |
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            -e "${GITHUB_WORKSPACE}/release-source/packages/honua-sdk"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run compatibility gate
        run: python release-source/scripts/compatibility_gate.py
        working-directory: ${{ github.workspace }}

      - name: Run SDK coverage gate
        env:
          HONUA_CAPABILITY_KEY_LIST_URL: https://raw.githubusercontent.com/honua-io/honua-server/trunk/docs/gis/data/capability-keys.v1.json
        run: python release-source/scripts/gen_sdk_coverage.py
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: python -m pytest release-source/tests/ -q --tb=short
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/release-source/packages/honua-sdk

      - name: Validate tag version
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        env:
          EXPECTED_TAG: ${{ needs.resolve-publish-targets.outputs.admin_tag }}
        run: >
          python "${GITHUB_WORKSPACE}/release-source/scripts/validate_publish_tag.py"
          --pyproject pyproject.toml
          --tag "$EXPECTED_TAG"
          --prefix python-admin-v

  build-honua-admin:
    needs:
      - resolve-publish-targets
      - verify-github-releases
      - validate-honua-admin
    if: needs.resolve-publish-targets.outputs.admin == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked build backend
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock

      - name: Build reproducible distribution
        uses: ./.github/actions/build-python-distribution
        with:
          package: honua-admin
          release-sha: ${{ needs.resolve-publish-targets.outputs.release_sha }}
          version: ${{ needs.resolve-publish-targets.outputs.admin_version }}

      - name: Upload verified admin artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: honua-admin-dist-${{ github.run_id }}
          path: |
            publish-artifact/dist
            publish-artifact/dist-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  preflight-honua-admin-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-admin
    if: needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      publish_required: ${{ steps.parity.outputs.publish_required }}
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified admin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}
          path: artifact

      - name: Require absent coordinate or exact PyPI parity
        id: parity
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase preflight

  publish-honua-admin:
    needs:
      - resolve-publish-targets
      - build-honua-admin
      - preflight-honua-admin-pypi
      - verify-honua-sdk-pypi
      - attach-honua-sdk-release
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-admin.result == 'success'
      && needs.preflight-honua-admin-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
      && needs.preflight-honua-admin-pypi.outputs.publish_required == 'true'
      && (needs.resolve-publish-targets.outputs.sdk != 'true'
          || (needs.verify-honua-sdk-pypi.result == 'success'
              && needs.attach-honua-sdk-release.result == 'success'))
    runs-on: ubuntu-latest
    environment: pypi-honua-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified admin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}
          path: artifact

      - name: Publish admin to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifact/dist

  verify-honua-admin-pypi:
    needs:
      - resolve-publish-targets
      - build-honua-admin
      - preflight-honua-admin-pypi
      - publish-honua-admin
      - verify-honua-sdk-pypi
      - attach-honua-sdk-release
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.build-honua-admin.result == 'success'
      && needs.resolve-publish-targets.outputs.admin == 'true'
      && (needs.resolve-publish-targets.outputs.publish != 'true'
          || (needs.preflight-honua-admin-pypi.result == 'success'
              && (needs.preflight-honua-admin-pypi.outputs.publish_required != 'true'
                  || needs.publish-honua-admin.result == 'success')
              && (needs.resolve-publish-targets.outputs.sdk != 'true'
                  || (needs.verify-honua-sdk-pypi.result == 'success'
                      && needs.attach-honua-sdk-release.result == 'success'))))
    runs-on: ubuntu-latest
    steps:
      - name: Record dry build completion
        if: needs.resolve-publish-targets.outputs.publish != 'true'
        run: echo "Dry run completed without accessing PyPI publishing credentials."

      - name: Checkout trusted publication automation
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download verified admin artifact
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: honua-admin-dist-${{ github.run_id }}
          path: artifact

      - name: Verify final admin PyPI filename and SHA256 parity
        if: needs.resolve-publish-targets.outputs.publish == 'true'
        run: >
          python scripts/verify_distribution_parity.py pypi
          --manifest artifact/dist-manifest.json
          --dist-dir artifact/dist
          --phase post-publish

  attach-honua-admin-release:
    needs:
      - resolve-publish-targets
      - verify-honua-admin-pypi
    if: >
      always()
      && needs.resolve-publish-targets.result == 'success'
      && needs.verify-honua-admin-pypi.result == 'success'
      && needs.resolve-publish-targets.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publication automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
