name: attest-python-distribution
description: Attest verified distribution bytes at their exact source commit
inputs:
  package:
    description: Distribution name
    required: true
  release-sha:
    description: Exact release commit
    required: true
runs:
  using: composite
  steps:
    - name: Require the workflow source to be the release commit
      env:
        RELEASE_SHA: ${{ inputs.release-sha }}
      shell: bash
      run: |
        if [ "$GITHUB_SHA" != "$RELEASE_SHA" ]; then
          echo "::error::workflow source $GITHUB_SHA is not release commit $RELEASE_SHA; an attestation from it would not bind the release source. Trunk moved past the release before this run started, so no attestation is produced; cut the next release from an unmoved trunk."
          exit 1
        fi

    - name: Unpack the wheel for SBOM cataloging
      id: wheel
      shell: bash
      run: |
        set -euo pipefail
        wheels=(artifact/dist/*.whl)
        [ "${#wheels[@]}" -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected exactly one wheel" >&2; exit 1; }
        mkdir -p "$RUNNER_TEMP/wheel"
        python3 -m zipfile -e "${wheels[0]}" "$RUNNER_TEMP/wheel"
        echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"

    # CycloneDX: actions/attest types SPDX as .../Document/v2.3, which the
    # collector does not accept; it accepts https://cyclonedx.org/bom.
    - name: Generate the wheel SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: ${{ runner.temp }}/wheel
        format: cyclonedx-json
        output-file: ${{ runner.temp }}/${{ inputs.package }}.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Refuse an SBOM that does not describe the wheel
      env:
        SBOM: ${{ runner.temp }}/${{ inputs.package }}.cdx.json
        DISTRIBUTION: ${{ inputs.package }}
      shell: bash
      run: >
        python3 -c "import json, os, sys;
        bom = json.load(open(os.environ['SBOM']));
        ok = bom.get('bomFormat') == 'CycloneDX' and any(c.get('type') == 'library' and c.get('name') == os.environ['DISTRIBUTION'] for c in bom.get('components', []));
        sys.exit(0 if ok else 'SBOM does not describe ' + os.environ['DISTRIBUTION'])"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: artifact/dist/*

    - name: Attest the wheel SBOM
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-path: ${{ steps.wheel.outputs.path }}
        sbom-path: ${{ runner.temp }}/${{ inputs.package }}.cdx.json
