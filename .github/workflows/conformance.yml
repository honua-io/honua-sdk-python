name: Python SDK Conformance

# Blocking live-server conformance lane (issue #81, epic geospatial-grpc#18 —
# the cross-repo Compatibility Train). It runs the *shared* geospatial-grpc
# conformance fixtures against a PINNED honua-server:nightly through the httpx
# clients (HonuaClient / AsyncHonuaClient) and fails on contract drift.
#
# Unlike the scheduled, advisory staging-integration lane, this job runs on
# every pull_request and push to trunk and is intended to be a required check.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      server_image:
        description: "honua-server image to certify against (repo:tag or repo@sha256:digest). Blank = pinned nightly. Used by the release-bundle train to certify the RC image."
        required: false
        default: ""
      server_seed_ref:
        description: "honua-server git ref to source the conformance seed from (should match the server_image commit). Blank = default branch."
        required: false
        default: ""
      candidate_cut_at:
        description: "Exact governed candidate cut timestamp (YYYY-MM-DDTHH:MM:SSZ). Required for release certification."
        required: false
        default: ""
      certification_tier:
        description: "Evidence policy tier: nightly or release. Release requires immutable image and full server SHA."
        required: false
        type: choice
        options: [nightly, release]
        default: nightly

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Shared geospatial-grpc fixture pin (must equal conformance/FIXTURES_VERSION).
  # The fetch helper verifies the bundle's embedded VERSION equals this value.
  CONFORMANCE_FIXTURES_VERSION: "0.2.0-alpha.1"
  # Current nightly image and its exact embedded source revision. Update these as
  # one identity so scheduled evidence never joins a candidate to unrelated seed
  # fixtures. Release dispatches continue to override both explicitly.
  HONUA_SERVER_IMAGE: ${{ github.event.inputs.server_image || 'ghcr.io/honua-io/honua-server@sha256:78e3088d64d832d3e2752c87d80bfcad201b414f4525989ca5d9a242cd5fee8a' }}
  HONUA_SERVER_NIGHTLY_REVISION: 'f897700159e2791c9468c6ca85bb4e2a3a8d8433'

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/honua-sdk/pyproject.toml

      - name: Build and install honua-sdk wheel
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          python -m build --wheel --outdir dist packages/honua-sdk --no-isolation
          wheel="$(find dist -maxdepth 1 -name 'honua_sdk-*.whl' -type f -print -quit)"
          [[ -n "${wheel}" ]]
          wheel_sha256="$(sha256sum "${wheel}" | cut -d ' ' -f 1)"
          python -m venv "${RUNNER_TEMP}/honua-sdk-certification"
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install --require-hashes --only-binary=:all: -r .github/requirements/ci.lock
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install --no-deps --no-build-isolation "${wheel}"
          {
            echo "HONUA_SDK_CERT_PYTHON=${RUNNER_TEMP}/honua-sdk-certification/bin/python"
            echo "HONUA_SDK_INSTALL_ROOT=${RUNNER_TEMP}/honua-sdk-certification"
            echo "HONUA_SDK_WHEEL_FILENAME=$(basename "${wheel}")"
            echo "HONUA_SDK_WHEEL_SHA256=${wheel_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Verify fixture pin matches conformance/FIXTURES_VERSION
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < conformance/FIXTURES_VERSION)"
          if [[ "${pinned}" != "${CONFORMANCE_FIXTURES_VERSION}" ]]; then
            echo "::error::conformance/FIXTURES_VERSION (${pinned}) != workflow pin (${CONFORMANCE_FIXTURES_VERSION})"
            exit 1
          fi
          echo "Fixture pin: ${pinned}"

      - name: Fetch pinned shared conformance fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./conformance/fetch-fixtures.sh \
            --version "${CONFORMANCE_FIXTURES_VERSION}" \
            --repo honua-io/geospatial-grpc \
            --dest "${GITHUB_WORKSPACE}/conformance-fixtures-${CONFORMANCE_FIXTURES_VERSION}"
          echo "HONUA_CONFORMANCE_FIXTURES_DIR=${GITHUB_WORKSPACE}/conformance-fixtures-${CONFORMANCE_FIXTURES_VERSION}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout Honua Server seed fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/honua-server
          path: honua-server
          # Release dispatches supply the RC commit. Scheduled and PR evidence use
          # the exact revision embedded in the pinned nightly image above.
          ref: ${{ github.event.inputs.server_seed_ref || env.HONUA_SERVER_NIGHTLY_REVISION }}

      - name: Start seeded pinned Honua target
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          HONUA_CERTIFICATION_TIER: ${{ github.event.inputs.certification_tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}
          SERVER_SEED_REF_INPUT: ${{ github.event.inputs.server_seed_ref }}
          CANDIDATE_CUT_AT_INPUT: ${{ github.event.inputs.candidate_cut_at }}
        run: |
          set -euo pipefail

          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"

          if [[ "${HONUA_CERTIFICATION_TIER}" == "release" ]]; then
            if [[ ! "${HONUA_SERVER_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::release certification requires server_image pinned by digest"
              exit 1
            fi
            if [[ ! "${SERVER_SEED_REF_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release certification requires a full 40-character server_seed_ref"
              exit 1
            fi
            python - "${CANDIDATE_CUT_AT_INPUT}" <<'PY'
          import sys

          from scripts._conformance import validate_candidate_cut_at

          validate_candidate_cut_at(sys.argv[1])
          PY
          fi

          # Override the one-shot seed to apply the canonical client-compat seed
          # (schema + test_service / layer 0 with JSONB feature attributes — the
          # honua-server#1238 path) and pin honua to the immutable nightly tag.
          #
          # ASPNETCORE_ENVIRONMENT=Development matches the metadata-v2 snapshot
          # the seed activates (it activates 'default'/'Development'/'Test', not
          # 'Production'); without this the server 500s with "No Metadata v2
          # snapshot has been activated for environment 'Production'".
          cat > "${override_file}" <<YAML
          services:
            seed:
              image: client-compat-seed:latest
              entrypoint:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Waiting for postgres postgres:5432..."
                  for attempt in \$(seq 1 30); do
                    if pg_isready -h postgres -p 5432 -U postgres >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done
                  echo "Applying conformance seed: tests/seed/client-compat-v1.sql"
                  psql -v ON_ERROR_STOP=1 -f tests/seed/client-compat-v1.sql
                  echo "Conformance seed complete."
            honua:
              image: ${HONUA_SERVER_IMAGE}
              ports:
                - "5000:5000"
              environment:
                ASPNETCORE_ENVIRONMENT: Development
                PUBLIC_BASE_URL: http://localhost:5000
          YAML

          docker pull "${HONUA_SERVER_IMAGE}"
          docker build \
            -t client-compat-seed:latest \
            -f "${server_root}/docker/client-compat/seed/Dockerfile" \
            "${server_root}"

          docker compose -f "${compose_file}" -f "${override_file}" up -d --no-build honua

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5000/healthz/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/healthz/ready >/dev/null

          resolved_image="$(docker image inspect "${HONUA_SERVER_IMAGE}" --format '{{ index .RepoDigests 0 }}' 2>/dev/null || true)"
          image_digest="${resolved_image##*@}"
          image_revision="$(docker image inspect "${HONUA_SERVER_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          seed_revision="$(git -C "${server_root}" rev-parse HEAD)"
          if [[ "${HONUA_CERTIFICATION_TIER}" == "release" ]]; then
            candidate_cut_at="${CANDIDATE_CUT_AT_INPUT}"
          else
            candidate_cut_at="$(git -C "${server_root}" show -s --format=%cI "${image_revision}")"
          fi

          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve an immutable server image digest"
            exit 1
          fi
          if [[ "${image_revision}" != "${seed_revision}" ]]; then
            echo "::error::${HONUA_CERTIFICATION_TIER} image revision ${image_revision} does not match checked-out seed revision ${seed_revision}"
            exit 1
          fi

          {
            echo "HONUA_BASE_URL=http://localhost:5000"
            echo "HONUA_SERVICE_ID=test_service"
            echo "HONUA_LAYER_ID=0"
            echo "HONUA_API_KEY=ClientCompatAdmin123!"
            echo "HONUA_SERVER_IMAGE_DIGEST=${image_digest}"
            echo "HONUA_SDK_SOURCE_SHA=${GITHUB_SHA}"
            echo "HONUA_EVIDENCE_URI=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "HONUA_CANDIDATE_CUT_AT=${candidate_cut_at}"
            echo "HONUA_CERTIFICATION_TIER=${HONUA_CERTIFICATION_TIER}"
            if [[ -n "${image_revision}" && "${image_revision}" != "<no value>" ]]; then
              echo "HONUA_SERVER_COMMIT=${image_revision}"
            fi
          } >> "${GITHUB_ENV}"

          {
            echo "## Python SDK live-server conformance — pinned target"
            echo "- Server image: \`${HONUA_SERVER_IMAGE}\`"
            if [[ -n "${image_digest}" ]]; then
              echo "- Resolved digest: \`${resolved_image}\`"
            fi
            if [[ -n "${image_revision}" && "${image_revision}" != "<no value>" ]]; then
              echo "- Image revision: \`${image_revision}\`"
            fi
            echo "- Governed candidate cut: \`${candidate_cut_at}\`"
            echo "- Fixture set: \`${CONFORMANCE_FIXTURES_VERSION}\` (geospatial-grpc shared fixtures)"
            echo "- Base URL: \`http://localhost:5000\` (service \`test_service\`, layer \`0\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run shared-fixture conformance suite
        env:
          HONUA_CONFORMANCE_SUMMARY_PATH: conformance-summary.md
          HONUA_PROTOCOL_CERTIFICATION_FRAGMENT_PATH: protocol-certification-fragment.json
        run: |
          "${HONUA_SDK_CERT_PYTHON}" -m pytest tests/conformance \
            -q \
            --run-integration \
            -m "integration and conformance" \
            -rsxX \
            --tb=short \
            --junitxml=conformance-junit.xml

      - name: Enforce release evidence outcomes
        if: ${{ github.event.inputs.certification_tier == 'release' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts._conformance import validate_release_certification_fragment

          fragment = json.loads(Path("protocol-certification-fragment.json").read_text())
          validate_release_certification_fragment(fragment)
          PY

      - name: Append case results to step summary
        if: ${{ always() }}
        run: |
          if [[ -f conformance-summary.md ]]; then
            cat conformance-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload conformance artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            conformance-junit.xml
            conformance-summary.md
            protocol-certification-fragment.json

      - name: Upload server diagnostics
        if: ${{ always() }}
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"
          docker compose -f "${compose_file}" -f "${override_file}" logs --no-color > conformance-server.log || true

      - name: Upload server log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-conformance-server-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: conformance-server.log

      - name: Stop seeded target
        if: ${{ always() }}
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"
          docker compose -f "${compose_file}" -f "${override_file}" down -v || true
