name: Python SDK Conformance
run-name: ${{ inputs.nightly_dispatch_id && format('Python SDK Conformance [{0}]', inputs.nightly_dispatch_id) || 'Python SDK Conformance' }}

# Blocking live-server conformance lane (issue #81, epic geospatial-grpc#18 —
# the cross-repo Compatibility Train). It runs the *shared* geospatial-grpc
# conformance fixtures against a PINNED honua-server:nightly through the httpx
# clients (HonuaClient / AsyncHonuaClient) and fails on contract drift.
#
# Unlike the scheduled, advisory staging-integration lane, this job runs on
# every pull_request and push to trunk and is intended to be a required check.
# PRs exercise the candidate wheel; trunk pushes and manual certification qualify
# the exact public wheel separately.

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      nightly_dispatch_id:
        description: "Correlation assigned by the governed nightly dispatcher; blank for ad-hoc diagnostics."
        required: false
        default: ""
      requirements_ref:
        description: "Optional exact protected-trunk honua-release source SHA; supply with requirements_revision."
        required: false
        default: ""
      requirements_revision:
        description: "Expected catalog revision at requirements_ref; both inputs must be supplied together."
        required: false
        default: ""
      server_image:
        description: "honua-server image to certify against (repo:tag or repo@sha256:digest). Blank = pinned nightly. Used by the release-bundle train to certify the RC image."
        required: false
        default: ""
      server_seed_ref:
        description: "honua-server git ref to source the conformance seed from (should match the server_image commit). Blank = default branch."
        required: false
        default: ""
      candidate_cut_at:
        description: "Exact governed candidate cut timestamp (YYYY-MM-DDTHH:MM:SSZ). Required for release certification."
        required: false
        default: ""
      sdk_package:
        description: "Nightly only: published package to certify (honua-sdk). Required with nightly_dispatch_id."
        required: false
        default: ""
      sdk_package_version:
        description: "Nightly only: exact published honua-sdk version on PyPI. Required with nightly_dispatch_id."
        required: false
        default: ""
      sdk_package_digest:
        description: "Nightly only: sha256:<64 hex> of the universal wheel file. Required with nightly_dispatch_id."
        required: false
        default: ""
      sdk_source_sha:
        description: "Nightly only: 40-hex source commit the published wheel was built from. Required with nightly_dispatch_id."
        required: false
        default: ""
      certification_tier:
        description: "Evidence policy tier: nightly or release. Release requires immutable image and full server SHA."
        required: false
        type: choice
        options: [nightly, release]
        default: nightly

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Shared geospatial-grpc fixture pin (must equal conformance/FIXTURES_VERSION).
  # The fetch helper verifies the bundle's embedded VERSION equals this value.
  CONFORMANCE_FIXTURES_VERSION: "1.0.3"
  # Exact published wheel selected by the platform manifest. Keep version,
  # filename, registry digest and published tag source together as one identity.
  # A governed nightly dispatch (nightly_dispatch_id) supplies this identity as
  # sdk_package* / sdk_source_sha inputs instead: the run is the trunk harness
  # certifying that exact published package, so these pins are not consulted.
  HONUA_SDK_PUBLIC_VERSION: "0.1.18"
  HONUA_SDK_PUBLIC_WHEEL: "honua_sdk-0.1.18-py3-none-any.whl"
  HONUA_SDK_PUBLIC_WHEEL_SHA256: "11d5c0074a8c3065b2ca2777a33efab6672dd1f03e0d664abc5f9f964727b033"
  HONUA_SDK_PUBLIC_SOURCE_SHA: "361978e86e816a35d93ee527b029a0c8f6e97efa"
  # Current nightly image and its exact embedded source revision. Update these as
  # one identity so scheduled evidence never joins a candidate to unrelated seed
  # fixtures. Release dispatches continue to override both explicitly.
  HONUA_SERVER_IMAGE: ${{ github.event.inputs.server_image || 'ghcr.io/honua-io/honua-server@sha256:78e3088d64d832d3e2752c87d80bfcad201b414f4525989ca5d9a242cd5fee8a' }}
  HONUA_SERVER_NIGHTLY_REVISION: 'f897700159e2791c9468c6ca85bb4e2a3a8d8433'

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bind nightly dispatch to the exact published honua-sdk package
        env:
          NIGHTLY_DISPATCH_ID: ${{ github.event.inputs.nightly_dispatch_id || '' }}
          REQUIREMENTS_SOURCE_SHA: ${{ github.event.inputs.requirements_ref || '' }}
          REQUIREMENTS_REVISION: ${{ github.event.inputs.requirements_revision || '' }}
          SDK_PACKAGE: ${{ github.event.inputs.sdk_package || '' }}
          SDK_PACKAGE_VERSION: ${{ github.event.inputs.sdk_package_version || '' }}
          SDK_PACKAGE_DIGEST: ${{ github.event.inputs.sdk_package_digest || '' }}
          SDK_SOURCE_SHA: ${{ github.event.inputs.sdk_source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -z "${NIGHTLY_DISPATCH_ID}" ]]; then
            echo "No nightly dispatch: certifying the repository-pinned public wheel."
            exit 0
          fi
          # The nightly runs this trunk harness against the exact published package it names.
          # Every identity input is required; refuse before anything is fetched or installed.
          fail() { echo "::error::nightly dispatch $1"; exit 1; }
          sha40='^[0-9a-f]{40}$'
          digest='^sha256:[0-9a-f]{64}$'
          version='^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] || fail "must arrive through workflow_dispatch"
          [[ "${REQUIREMENTS_SOURCE_SHA}" =~ ${sha40} ]] || fail "requires requirements_ref as a 40-hex honua-release commit"
          [[ -n "${REQUIREMENTS_REVISION//[[:space:]]/}" ]] || fail "requires requirements_revision"
          [[ "${SDK_PACKAGE}" == "honua-sdk" ]] || fail "requires sdk_package=honua-sdk"
          [[ "${SDK_PACKAGE_VERSION}" =~ ${version} ]] || fail "requires sdk_package_version as an exact normalized release version"
          [[ "${SDK_PACKAGE_DIGEST}" =~ ${digest} ]] || fail "requires sdk_package_digest as sha256:<64 lowercase hex>"
          [[ "${SDK_SOURCE_SHA}" =~ ${sha40} ]] || fail "requires sdk_source_sha as a 40-hex source commit"
          [[ "${GITHUB_SHA}" =~ ${sha40} ]] || fail "requires a 40-hex harness commit"
          {
            echo "## Nightly certification identity"
            echo "- Harness commit: \`${GITHUB_SHA}\`"
            echo "- Package: \`${SDK_PACKAGE}==${SDK_PACKAGE_VERSION}\` (\`${SDK_PACKAGE_DIGEST}\`)"
            echo "- Package source: \`${SDK_SOURCE_SHA}\`"
            echo "- Requirements: \`${REQUIREMENTS_SOURCE_SHA}\` (\`${REQUIREMENTS_REVISION}\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain immutable protected-trunk certification requirements
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIREMENTS_SOURCE_SHA: ${{ github.event.inputs.requirements_ref || '' }}
          REQUIREMENTS_REVISION: ${{ github.event.inputs.requirements_revision || '' }}
        run: |
          args=(--destination "${GITHUB_WORKSPACE}/honua-release-governance")
          if [[ -n "${REQUIREMENTS_SOURCE_SHA}" || -n "${REQUIREMENTS_REVISION}" ]]; then
            args+=(--source-sha "${REQUIREMENTS_SOURCE_SHA}" --requirements-revision "${REQUIREMENTS_REVISION}")
          fi
          python3 scripts/fetch_certification_requirements.py "${args[@]}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: packages/honua-sdk/pyproject.toml

      - name: Build and install candidate honua-sdk wheel
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock
          python -m build --wheel --no-isolation --outdir dist packages/honua-sdk
          wheel="$(find dist -maxdepth 1 -name 'honua_sdk-*.whl' -type f -print -quit)"
          [[ -n "${wheel}" ]]
          wheel_filename="$(basename "${wheel}")"
          wheel_sha256="$(sha256sum "${wheel}" | cut -d ' ' -f 1)"
          wheel_requirement="${RUNNER_TEMP}/honua-sdk-wheel-requirement.txt"
          printf '%s --hash=sha256:%s\n' "$(realpath "${wheel}")" "${wheel_sha256}" > "${wheel_requirement}"
          python -m venv "${RUNNER_TEMP}/honua-sdk-certification"
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install \
            --require-hashes \
            --no-deps \
            -r "${wheel_requirement}"
          {
            echo "HONUA_SDK_CERT_PYTHON=${RUNNER_TEMP}/honua-sdk-certification/bin/python"
            echo "HONUA_SDK_INSTALL_ROOT=${RUNNER_TEMP}/honua-sdk-certification"
            echo "HONUA_SDK_WHEEL_FILENAME=${wheel_filename}"
            echo "HONUA_SDK_WHEEL_SHA256=${wheel_sha256}"
            echo "HONUA_SDK_WHEEL_SOURCE=github-actions"
            echo "HONUA_SDK_SOURCE_SHA=${GITHUB_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Download and install exact public honua-sdk wheel
        if: ${{ github.event_name != 'pull_request' }}
        env:
          NIGHTLY_DISPATCH_ID: ${{ github.event.inputs.nightly_dispatch_id || '' }}
          SDK_PACKAGE_VERSION: ${{ github.event.inputs.sdk_package_version || '' }}
          SDK_PACKAGE_DIGEST: ${{ github.event.inputs.sdk_package_digest || '' }}
          SDK_SOURCE_SHA: ${{ github.event.inputs.sdk_source_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${NIGHTLY_DISPATCH_ID}" ]]; then
            # Validated by the bind step: the dispatched package is the governed identity.
            HONUA_SDK_PUBLIC_VERSION="${SDK_PACKAGE_VERSION}"
            HONUA_SDK_PUBLIC_WHEEL="honua_sdk-${SDK_PACKAGE_VERSION}-py3-none-any.whl"
            HONUA_SDK_PUBLIC_WHEEL_SHA256="${SDK_PACKAGE_DIGEST#sha256:}"
            HONUA_SDK_PUBLIC_SOURCE_SHA="${SDK_SOURCE_SHA}"
          fi
          mkdir -p dist
          python -m pip download \
            --dest dist \
            --no-deps \
            --only-binary=:all: \
            "honua-sdk==${HONUA_SDK_PUBLIC_VERSION}"
          wheel="dist/${HONUA_SDK_PUBLIC_WHEEL}"
          [[ -f "${wheel}" ]]
          echo "${HONUA_SDK_PUBLIC_WHEEL_SHA256}  ${wheel}" | sha256sum --check --strict
          wheel_requirement="${RUNNER_TEMP}/honua-sdk-wheel-requirement.txt"
          printf '%s --hash=sha256:%s\n' "$(realpath "${wheel}")" "${HONUA_SDK_PUBLIC_WHEEL_SHA256}" > "${wheel_requirement}"
          python -m venv "${RUNNER_TEMP}/honua-sdk-certification"
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r .github/requirements/publish-python.lock
          "${RUNNER_TEMP}/honua-sdk-certification/bin/python" -m pip install \
            --require-hashes \
            --no-deps \
            -r "${wheel_requirement}"
          installed_version="$("${RUNNER_TEMP}/honua-sdk-certification/bin/python" -c \
            'import importlib.metadata; print(importlib.metadata.version("honua-sdk"))')"
          [[ "${installed_version}" == "${HONUA_SDK_PUBLIC_VERSION}" ]]
          {
            echo "HONUA_SDK_CERT_PYTHON=${RUNNER_TEMP}/honua-sdk-certification/bin/python"
            echo "HONUA_SDK_INSTALL_ROOT=${RUNNER_TEMP}/honua-sdk-certification"
            echo "HONUA_SDK_WHEEL_FILENAME=${HONUA_SDK_PUBLIC_WHEEL}"
            echo "HONUA_SDK_WHEEL_SHA256=${HONUA_SDK_PUBLIC_WHEEL_SHA256}"
            echo "HONUA_SDK_WHEEL_SOURCE=pypi"
            echo "HONUA_SDK_SOURCE_SHA=${HONUA_SDK_PUBLIC_SOURCE_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Verify fixture pin matches conformance/FIXTURES_VERSION
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < conformance/FIXTURES_VERSION)"
          if [[ "${pinned}" != "${CONFORMANCE_FIXTURES_VERSION}" ]]; then
            echo "::error::conformance/FIXTURES_VERSION (${pinned}) != workflow pin (${CONFORMANCE_FIXTURES_VERSION})"
            exit 1
          fi
          echo "Fixture pin: ${pinned}"

      - name: Fetch pinned shared conformance fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./conformance/fetch-fixtures.sh \
            --version "${CONFORMANCE_FIXTURES_VERSION}" \
            --repo honua-io/geospatial-grpc \
            --dest "${GITHUB_WORKSPACE}/conformance-fixtures-${CONFORMANCE_FIXTURES_VERSION}"
          echo "HONUA_CONFORMANCE_FIXTURES_DIR=${GITHUB_WORKSPACE}/conformance-fixtures-${CONFORMANCE_FIXTURES_VERSION}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Checkout Honua Server seed fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/honua-server
          path: honua-server
          # Release dispatches supply the RC commit. Scheduled and PR evidence use
          # the exact revision embedded in the pinned nightly image above.
          ref: ${{ github.event.inputs.server_seed_ref || env.HONUA_SERVER_NIGHTLY_REVISION }}

      - name: Start seeded pinned Honua target
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          HONUA_CERTIFICATION_TIER: ${{ github.event.inputs.certification_tier || (github.event_name == 'pull_request' && 'pr') || 'nightly' }}
          SERVER_SEED_REF_INPUT: ${{ github.event.inputs.server_seed_ref }}
          CANDIDATE_CUT_AT_INPUT: ${{ github.event.inputs.candidate_cut_at }}
          CERTIFICATION_EVENT: ${{ github.event_name }}
          # Unconfigured until an operator provisions the governed signed license.
          # Rehearsal events never receive this release-only value.
          HONUA_CERTIFICATION_LICENSE_CONTENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.certification_tier == 'release' && secrets.HONUA_CERTIFICATION_LICENSE_CONTENT || '' }}
        run: |
          set -euo pipefail

          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"

          if [[ "${HONUA_CERTIFICATION_TIER}" == "release" ]]; then
            if [[ ! "${HONUA_SERVER_IMAGE}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::release certification requires server_image pinned by digest"
              exit 1
            fi
            if [[ ! "${SERVER_SEED_REF_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::release certification requires a full 40-character server_seed_ref"
              exit 1
            fi
            "${HONUA_SDK_CERT_PYTHON}" - "${CANDIDATE_CUT_AT_INPUT}" <<'PY'
          import sys

          from scripts._conformance import validate_candidate_cut_at

          validate_candidate_cut_at(sys.argv[1])
          PY
          fi

          entitlement_profile="$("${HONUA_SDK_CERT_PYTHON}" - <<'PY'
          import json
          import os
          from scripts._conformance_entitlement import profile
          print(json.dumps(profile(os.environ["HONUA_CERTIFICATION_TIER"], os.environ["CERTIFICATION_EVENT"],
                                   "Development", os.environ.get("HONUA_CERTIFICATION_LICENSE_CONTENT", ""))))
          PY
          )"
          dev_grant="$(jq -er '.devGrantEdition | strings' <<< "${entitlement_profile}")"
          entitlement_mode="$(jq -er '.mode' <<< "${entitlement_profile}")"
          echo "HONUA_ENTITLEMENT_MODE=${entitlement_mode}" >> "${GITHUB_ENV}"

          # Override the one-shot seed to apply the canonical client-compat seed
          # (schema + test_service / layer 0 with JSONB feature attributes — the
          # honua-server#1238 path) and pin honua to the immutable nightly tag.
          #
          # ASPNETCORE_ENVIRONMENT=Development matches the metadata-v2 snapshot
          # the seed activates (it activates 'default'/'Development'/'Test', not
          # 'Production'); without this the server 500s with "No Metadata v2
          # snapshot has been activated for environment 'Production'".
          cat > "${override_file}" <<YAML
          services:
            seed:
              image: client-compat-seed:latest
              entrypoint:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Waiting for postgres postgres:5432..."
                  for attempt in \$(seq 1 30); do
                    if pg_isready -h postgres -p 5432 -U postgres >/dev/null 2>&1; then
                      break
                    fi
                    sleep 2
                  done
                  echo "Applying conformance seed: tests/seed/client-compat-v1.sql"
                  psql -v ON_ERROR_STOP=1 -f tests/seed/client-compat-v1.sql
                  echo "Conformance seed complete."
            honua:
              image: ${HONUA_SERVER_IMAGE}
              ports:
                - "5000:5000"
                - "127.0.0.1::5001"
              environment:
                ASPNETCORE_ENVIRONMENT: Development
                # Explicit test fixture only. The release profile always clears it.
                Licensing__DevGrantEdition: "${dev_grant}"
                Licensing__Mode: Enabled
                # Preserve the Compose reference: never write signed license bytes
                # into the generated override or retained artifacts.
                Licensing__LicenseContent: "\${HONUA_CERTIFICATION_LICENSE_CONTENT:-}"
                PUBLIC_BASE_URL: http://localhost:5000
          YAML

          docker pull "${HONUA_SERVER_IMAGE}"
          docker build \
            -t client-compat-seed:latest \
            -f "${server_root}/docker/client-compat/seed/Dockerfile" \
            "${server_root}"

          seed_dependency="$(docker compose -f "${compose_file}" -f "${override_file}" config --format json | python -c 'import json,sys; deps=json.load(sys.stdin)["services"]["honua"]["depends_on"]; assert isinstance(deps,(dict,list)); print("true" if "seed" in deps else "false")')"
          docker compose -f "${compose_file}" -f "${override_file}" up -d --no-build honua
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5000/healthz/ready >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5000/healthz/ready >/dev/null

          # Legacy pinned sources seed before startup through honua's dependency.
          # Current sources let Honua own migrations first, then seed depends on Honua.
          # Starting honua alone does not start that dependent one-shot service.
          if [[ "${seed_dependency}" == "false" ]]; then
            docker compose -f "${compose_file}" -f "${override_file}" run --rm --no-deps seed
          fi

          # The post-migration seed must also leave the target ready for clients.
          curl -fsS http://localhost:5000/healthz/ready >/dev/null

          resolved_image="$(docker image inspect "${HONUA_SERVER_IMAGE}" --format '{{ index .RepoDigests 0 }}' 2>/dev/null || true)"
          image_digest="${resolved_image##*@}"
          image_revision="$(docker image inspect "${HONUA_SERVER_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
          seed_revision="$(git -C "${server_root}" rev-parse HEAD)"
          if [[ "${HONUA_CERTIFICATION_TIER}" == "release" ]]; then
            candidate_cut_at="${CANDIDATE_CUT_AT_INPUT}"
          else
            candidate_cut_at="$(git -C "${server_root}" show -s --format=%cI "${image_revision}")"
          fi

          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve an immutable server image digest"
            exit 1
          fi
          if [[ "${image_revision}" != "${seed_revision}" ]]; then
            echo "::error::${HONUA_CERTIFICATION_TIER} image revision ${image_revision} does not match checked-out seed revision ${seed_revision}"
            exit 1
          fi

          {
            echo "HONUA_BASE_URL=http://localhost:5000"
            grpc_port="$(docker compose -f "${compose_file}" -f "${override_file}" port honua 5001)"
            [[ "${grpc_port}" =~ ^127\.0\.0\.1:[0-9]+$ ]]
            echo "HONUA_GRPC_TARGET=localhost:${grpc_port##*:}"
            echo "HONUA_SERVICE_ID=test_service"
            echo "HONUA_LAYER_ID=0"
            echo "HONUA_API_KEY=ClientCompatAdmin123!"
            echo "HONUA_SERVER_IMAGE_DIGEST=${image_digest}"
            echo "HONUA_EVIDENCE_URI=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "HONUA_CANDIDATE_CUT_AT=${candidate_cut_at}"
            echo "HONUA_CERTIFICATION_TIER=${HONUA_CERTIFICATION_TIER}"
            if [[ -n "${image_revision}" && "${image_revision}" != "<no value>" ]]; then
              echo "HONUA_SERVER_COMMIT=${image_revision}"
            fi
          } >> "${GITHUB_ENV}"

          {
            echo "## Python SDK live-server conformance — pinned target"
            echo "- Server image: \`${HONUA_SERVER_IMAGE}\`"
            if [[ -n "${image_digest}" ]]; then
              echo "- Resolved digest: \`${resolved_image}\`"
            fi
            if [[ -n "${image_revision}" && "${image_revision}" != "<no value>" ]]; then
              echo "- Image revision: \`${image_revision}\`"
            fi
            echo "- Governed candidate cut: \`${candidate_cut_at}\`"
            echo "- Fixture set: \`${CONFORMANCE_FIXTURES_VERSION}\` (geospatial-grpc shared fixtures)"
            echo "- Base URL: \`http://localhost:5000\` (service \`test_service\`, layer \`0\`)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run shared-fixture conformance suite
        env:
          HONUA_NIGHTLY_DISPATCH_ID: ${{ github.event.inputs.nightly_dispatch_id || '' }}
          HONUA_CONFORMANCE_SUMMARY_PATH: conformance-summary.md
          # Only a release-tier dispatch can produce a governed fragment. PR, push and nightly-tier
          # runs use the Development rehearsal grant, whose auth_policy_revision is
          # development-grant-rehearsal-v1 and by design never matches a governed cell, so
          # requesting a fragment there turns every trunk run red without producing evidence.
          HONUA_PROTOCOL_CERTIFICATION_FRAGMENT_PATH: ${{ github.event.inputs.certification_tier == 'release' && 'protocol-certification-fragment.json' || '' }}
          HONUA_CERTIFICATION_REQUIREMENTS_PATH: ${{ github.workspace }}/honua-release-governance/protocol-certification-requirements.v1.json
        run: |
          "${HONUA_SDK_CERT_PYTHON}" -m pytest tests/conformance \
            -q \
            --run-integration \
            -m "integration and conformance" \
            -rsxX \
            --tb=short \
            --junitxml=conformance-junit.xml

      - name: Enforce release evidence outcomes
        if: ${{ github.event.inputs.certification_tier == 'release' }}
        run: |
          "${HONUA_SDK_CERT_PYTHON}" - <<'PY'
          import json
          from pathlib import Path
          from scripts._conformance import validate_release_certification_fragment

          fragment = json.loads(Path("protocol-certification-fragment.json").read_text())
          validate_release_certification_fragment(fragment)
          PY

      - name: Append case results to step summary
        if: ${{ always() }}
        run: |
          if [[ -f conformance-summary.md ]]; then
            cat conformance-summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload conformance artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-conformance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            conformance-junit.xml
            conformance-summary.md
            protocol-certification-fragment.json

      - name: Upload server diagnostics
        if: ${{ always() }}
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"
          docker compose -f "${compose_file}" -f "${override_file}" logs --no-color > conformance-server.log || true

      - name: Upload server log artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdk-conformance-server-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: conformance-server.log

      - name: Stop seeded target
        if: ${{ always() }}
        env:
          COMPOSE_PROJECT_NAME: honua-python-conformance-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          server_root="${GITHUB_WORKSPACE}/honua-server"
          compose_file="${server_root}/docker/client-compat/compose.yml"
          override_file="${RUNNER_TEMP}/python-conformance-compose.override.yml"
          docker compose -f "${compose_file}" -f "${override_file}" down -v || true
